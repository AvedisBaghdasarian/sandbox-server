# E2E edge proxy: public address is http://localhost:8099/sandbox-server,
# mirroring production (https://openhands.noidlabs.org/sandbox-server).
# Strips the mount prefix before forwarding; the app rebuilds it from
# SERVICE_URL_SANDBOX_SERVER when generating browser-facing URLs.

upstream backend {
    server sandbox-server:3000;
}

server {
    listen 80;

    # Exact prefix without trailing slash: normalize onto the slashed form
    # so relative resolution in the browser stays consistent.
    location = /sandbox-server {
        return 308 /sandbox-server/;
    }

    location /sandbox-server/ {
        proxy_pass http://backend/;
        proxy_http_version 1.1;

        # WebSocket upgrades (sockets/events, sockets/bash-events).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Prefix /sandbox-server;

        proxy_connect_timeout 30s;
        proxy_send_timeout 330s;
        proxy_read_timeout 330s;
    }
}
